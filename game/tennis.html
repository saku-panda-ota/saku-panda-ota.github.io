<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かんたんテニスゲーム</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #e8f5e9;
      color: #17351d;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main { width: min(100%, 720px); }
    h1 { margin: 0 0 8px; }
    p { margin: 8px 0 14px; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 4px solid #fff;
      border-radius: 12px;
      background: #4caf50;
      box-shadow: 0 8px 24px #17351d33;
      touch-action: none;
    }
    button {
      margin-top: 14px;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #1b5e20;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #2e7d32; }
  </style>
</head>
<body>
  <main>
    <h1>かんたんテニスゲーム</h1>
    <p>マウス・タッチ、または ↑ / ↓ キーでラケットを動かそう。先に5点取ると勝ち！</p>
    <canvas id="court" width="720" height="480" aria-label="テニスゲームのコート"></canvas>
    <p id="status" aria-live="polite">ゲーム開始！</p>
    <button id="restart" type="button">もう一度プレイ</button>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('court');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');
      const paddle = { x: 24, y: 200, width: 12, height: 82, speed: 7 };
      const opponent = { x: 684, y: 200, width: 12, height: 82, speed: 4 };
      const ball = { x: 360, y: 240, radius: 9, vx: 5, vy: 3 };
      const keys = new Set();
      let playerScore = 0;
      let opponentScore = 0;
      let finished = false;
      let animationId;

      function resetBall(direction) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.vx = 5 * direction;
        ball.vy = Math.random() * 4 - 2;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,.8)';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#fff';
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillRect(opponent.x, opponent.y, opponent.width, opponent.height);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = 'bold 36px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(playerScore, canvas.width / 2 - 48, 48);
        ctx.fillText(opponentScore, canvas.width / 2 + 48, 48);
      }

      function update() {
        if (finished) return;

        if (keys.has('ArrowUp')) paddle.y -= paddle.speed;
        if (keys.has('ArrowDown')) paddle.y += paddle.speed;
        paddle.y = Math.max(0, Math.min(canvas.height - paddle.height, paddle.y));

        const opponentCenter = opponent.y + opponent.height / 2;
        if (opponentCenter < ball.y - 8) opponent.y += opponent.speed;
        if (opponentCenter > ball.y + 8) opponent.y -= opponent.speed;
        opponent.y = Math.max(0, Math.min(canvas.height - opponent.height, opponent.y));

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
          ball.vy *= -1;
        }
        if (ball.vx < 0 && ball.x - ball.radius <= paddle.x + paddle.width &&
            ball.y >= paddle.y && ball.y <= paddle.y + paddle.height) {
          ball.vx = Math.abs(ball.vx) * 1.04;
          ball.vy += ((ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2)) * 2;
        }
        if (ball.vx > 0 && ball.x + ball.radius >= opponent.x &&
            ball.y >= opponent.y && ball.y <= opponent.y + opponent.height) {
          ball.vx = -Math.abs(ball.vx) * 1.02;
          ball.vy += ((ball.y - (opponent.y + opponent.height / 2)) / (opponent.height / 2)) * 1.5;
        }

        if (ball.x < 0) {
          opponentScore++;
          resetBall(-1);
        } else if (ball.x > canvas.width) {
          playerScore++;
          resetBall(1);
        }

        if (playerScore >= 5 || opponentScore >= 5) {
          finished = true;
          status.textContent = playerScore >= 5 ? 'あなたの勝ち！おめでとう！' : '相手の勝ち！もう一度挑戦しよう。';
        }
        draw();
        if (!finished) animationId = requestAnimationFrame(update);
      }

      function movePaddle(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleY = canvas.height / rect.height;
        paddle.y = (event.clientY - rect.top) * scaleY - paddle.height / 2;
        paddle.y = Math.max(0, Math.min(canvas.height - paddle.height, paddle.y));
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          event.preventDefault();
          keys.add(event.key);
        }
      });
      document.addEventListener('keyup', (event) => keys.delete(event.key));
      canvas.addEventListener('pointermove', movePaddle);
      document.getElementById('restart').addEventListener('click', () => {
        cancelAnimationFrame(animationId);
        playerScore = 0;
        opponentScore = 0;
        paddle.y = 200;
        opponent.y = 200;
        finished = false;
        status.textContent = 'ゲーム開始！';
        resetBall(Math.random() < 0.5 ? -1 : 1);
        draw();
        animationId = requestAnimationFrame(update);
      });

      draw();
      animationId = requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
